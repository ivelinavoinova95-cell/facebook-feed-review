name: Refresh candidate feed for review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: candidate-feed-review
  cancel-in-progress: false
jobs:
  refresh:
    # Standard runner only. No paid larger runner, artifact storage or external secret.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test and refresh explicit review products
        shell: pwsh
        run: ./refresh-review.ps1 -OutputDirectory ./review
      - name: Commit review output if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- review/candidate.csv review/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh review-only candidate feed'
            git push
          fi
